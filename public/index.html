<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployment Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: #16213e;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
    p { margin: 0.25rem 0; color: #9aa5c4; }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.4rem 1rem;
      background: #9d0f91;
      color: #fff;
      border-radius: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Holiday is coming</h1>
    <p>Test Deployment by Yijia</p>
    <p>Lalalalla</p>
    <span class="badge">Test OK</span>
  </div>
</body>
</html>
